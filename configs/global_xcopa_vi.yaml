# Global pipeline: search for one explanation instruction that generalises.
dataset:
  name: xcopa_vi
  lang: vi
  split: test

predictor:
  name: qwen
  model_id: Qwen/Qwen3-4B-Instruct-2507
  load_in_4bit: false

explainer:
  name: deepseek
  model_id: deepseek-v4-pro

metric:
  name: paper
  scorer: logprob

run:
  pipeline: global
  round_xai_iter: 10        # optimisation rounds
  ques_sample: 15           # questions sampled per round
  output_dir: ./results
  resume: true
  seed: 42
